<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4E9D8">
<meta name="description" content="LABKI · Impresión 3D hecha realidad">
<title>LABKI</title>

<style>
:root{
  --beige:#F4E9D8;
  --beige-card:rgba(255,250,243,.92);
  --turquesa:#69C2BC;
  --turquesa-claro:#9EE2DC;
  --turquesa-vivo:#4FDCD2;
  --turquesa-oscuro:#379A96;
  --carbon:#30353A;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  color:var(--carbon);
  background:#e9e1d6;
}

body{
  min-height:100svh;
  display:flex;
  justify-content:center;
}

.page{
  position:relative;
  width:100%;
  max-width:560px;
  min-height:100svh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:46px 26px 28px;
  background:
    linear-gradient(rgba(244,233,216,.08), rgba(244,233,216,.08)),
    url("fondo-panal.jpg") center/cover no-repeat;
}

.page::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 24%, rgba(255,255,255,.36), transparent 34%),
    linear-gradient(to bottom, rgba(255,255,255,.04), rgba(244,233,216,.04));
}

.brand{
  position:relative;
  z-index:3;
  width:100%;
  text-align:center;
}

.symbol{
  width:92px;
  height:auto;
  display:block;
  margin:0 auto 18px;
  filter:drop-shadow(0 10px 10px rgba(48,53,58,.14));
}

.logo{
  width:min(92%,420px);
  height:auto;
  display:block;
  margin:0 auto 14px;
  filter:drop-shadow(0 8px 8px rgba(48,53,58,.08));
}

.tagline{
  margin:0 0 38px;
  font-size:clamp(12px,3.4vw,16px);
  font-weight:700;
  letter-spacing:.18em;
}

.tagline span{
  color:var(--turquesa-oscuro);
}

.links{
  position:relative;
  z-index:5;
  width:100%;
  display:grid;
  gap:18px;
}

.link{
  min-height:104px;
  display:grid;
  grid-template-columns:76px 1fr 24px;
  align-items:center;
  gap:0;
  padding:12px 18px;
  border-radius:30px;
  text-decoration:none;
  color:var(--carbon);
  background:var(--beige-card);
  border:1px solid rgba(255,255,255,.95);
  box-shadow:
    0 16px 30px rgba(48,53,58,.15),
    inset 0 1px 0 rgba(255,255,255,1);
  backdrop-filter:blur(9px);
  -webkit-backdrop-filter:blur(9px);
  transition:transform .2s ease, box-shadow .2s ease;
}

.link:hover{
  transform:translateY(-4px);
  box-shadow:
    0 22px 38px rgba(48,53,58,.20),
    inset 0 1px 0 rgba(255,255,255,1);
}

.icon{
  width:59px;
  height:59px;
  border-radius:19px;
  display:grid;
  place-items:center;
  background:
    linear-gradient(145deg,
      #D9F8F5 0%,
      #A9EAE4 24%,
      #74D3CB 52%,
      #55BFB9 75%,
      #369795 100%);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.95),
    0 0 16px rgba(79,220,210,.34),
    0 8px 18px rgba(55,154,150,.22);
}

.icon svg{
  width:39px;
  height:39px;
}

.instagram svg *{
  fill:none;
  stroke:#FFF8EE;
  stroke-width:3;
}

.instagram svg .dot{
  fill:#FFF8EE;
  stroke:none;
}

.tiktok svg path{
  fill:#FFF8EE;
  filter:
    drop-shadow(-2px 2px 0 rgba(55,154,150,.60))
    drop-shadow(1px -1px 0 rgba(158,226,220,.50));
}

.text strong{
  display:block;
  font-size:18px;
  letter-spacing:.055em;
}

.text small{
  display:block;
  margin-top:4px;
  color:var(--turquesa-oscuro);
  font-size:17px;
}

.arrow{
  font-size:42px;
  line-height:1;
  color:var(--turquesa-oscuro);
  font-weight:200;
}

.kifu{
  position:absolute;
  left:-52px;
  bottom:0;
  width:245px;
  z-index:2;
  pointer-events:none;
  filter:drop-shadow(0 12px 24px rgba(48,53,58,.15));
}

.footer{
  position:relative;
  z-index:4;
  margin-top:auto;
  padding-top:52px;
  text-align:center;
}

.footer p{
  margin:0;
  font-size:13px;
  line-height:1.55;
  letter-spacing:.10em;
  font-weight:650;
}

.footer span{
  color:var(--turquesa-oscuro);
}

.heart{
  color:var(--turquesa);
  font-size:22px;
  margin-top:5px;
}

@media (min-width:700px){
  body{padding:28px}
  .page{
    min-height:850px;
    border-radius:34px;
    box-shadow:0 26px 70px rgba(48,53,58,.20);
  }
}

@media (max-height:760px){
  .page{padding-top:24px}
  .symbol{width:70px;margin-bottom:8px}
  .logo{width:min(78%,350px)}
  .tagline{margin-bottom:18px}
  .link{min-height:88px}
  .kifu{width:190px}
  .footer{padding-top:24px}
}
</style>
</head>

<body>
<main class="page">

  <header class="brand">
    <img class="symbol" src="simbolo-labki.png" alt="Símbolo LABKI">
    <img class="logo" src="logo-labki.png" alt="LABKI">
    <p class="tagline">IMPRESIÓN <span>3D</span> HECHA REALIDAD</p>
  </header>

  <nav class="links" aria-label="Redes sociales LABKI">

    <a class="link" href="https://www.instagram.com/labki_3d/" target="_blank" rel="noopener noreferrer">
      <span class="icon instagram" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <rect x="7.5" y="7.5" width="33" height="33" rx="10"/>
          <circle cx="24" cy="24" r="8"/>
          <circle class="dot" cx="34.5" cy="13.8" r="2.2"/>
        </svg>
      </span>
      <span class="text">
        <strong>INSTAGRAM</strong>
        <small>@labki_3d</small>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="link" href="https://www.tiktok.com/@labki_3d" target="_blank" rel="noopener noreferrer">
      <span class="icon tiktok" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <path d="M29 7v21.7a9.3 9.3 0 1 1-7.3-9.1v6.3a3.3 3.3 0 1 0 2.1 3.1V7H29zm0 0c1 5.1 4 8 9.3 8.8v6.1c-3.9-.3-7-1.6-9.3-3.9z"/>
        </svg>
      </span>
      <span class="text">
        <strong>TIKTOK</strong>
        <small>@labki_3d</small>
      </span>
      <span class="arrow">›</span>
    </a>

  </nav>

  <img class="kifu" src="kifu-saludando.png" alt="Kifu saludando">

  <footer class="footer">
    <p><span>IDEAS EN TU CABEZA,</span><br>REALIDAD EN TUS MANOS.</p>
    <div class="heart">♥</div>
  </footer>

</main>
</body>
</html>
